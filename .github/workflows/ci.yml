# ==================================================================
# Intégration continue : tests à chaque push, puis publication de l'image
# Docker (uniquement sur master, et uniquement si tous les tests passent).
# ==================================================================
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  # ----------------------------------------------------------------
  # Moteur de jeu et serveur : compilation et tous les tests Java
  # ----------------------------------------------------------------
  backend:
    name: Tests Java
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven # garde les dépendances Maven entre deux exécutions

      # Docker est disponible sur la machine : Testcontainers démarre PostgreSQL tout seul
      - name: Compilation et tests
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp verify

  # ----------------------------------------------------------------
  # Front Vue : types, qualité du code, tests et compilation
  # ----------------------------------------------------------------
  frontend:
    name: Front
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: poker-web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: poker-web/package-lock.json

      - name: Installation des dépendances
        run: npm ci

      - name: Vérification du TypeScript
        run: npm run type-check

      - name: Analyse du code (ESLint)
        run: npx eslint .

      - name: Tests unitaires
        run: npx vitest run --passWithNoTests

      - name: Compilation
        run: npm run build-only

  # ----------------------------------------------------------------
  # Image Docker : construite et publiée seulement si tout est vert
  # ----------------------------------------------------------------
  docker:
    name: Image Docker
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # nécessaire pour publier dans le registre de GitHub (ghcr.io)
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Connexion au registre de GitHub
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # fourni automatiquement par GitHub

      # Calcule le nom de l'image (en minuscules) et ses étiquettes :
      # "latest", et l'identifiant du commit pour pouvoir revenir à une version précise
      - name: Nom et étiquettes de l'image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/poker-game
          tags: |
            type=raw,value=latest
            type=sha

      - name: Construction et publication
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max