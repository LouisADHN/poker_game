# ==================================================================
# Configuration de production : lue uniquement avec le profil "prod"
# (variable d'environnement SPRING_PROFILES_ACTIVE=prod).
# Les valeurs ci-dessous remplacent celles de application.properties.
# ==================================================================

# Clé JWT : OBLIGATOIRE, sans valeur par défaut.
# Si la variable POKER_JWT_SECRET est absente, l'application refuse de démarrer,
# au lieu d'utiliser la clé de développement connue de tous.
poker.jwt.secret=${POKER_JWT_SECRET}

# Origines autorisées pour le WebSocket (l'adresse publique du site)
poker.allowed-origins=${POKER_ALLOWED_ORIGINS}

# Pas de Docker Compose automatique : la base est fournie par compose.prod.yaml
spring.docker.compose.enabled=false

# Derrière un proxy HTTPS (étape 10e) : faire confiance aux en-têtes X-Forwarded-*
# pour connaître la vraie adresse (https://...) demandée par le navigateur
server.forward-headers-strategy=framework

# Messages d'erreur : jamais de détail technique envoyé aux visiteurs
server.error.include-stacktrace=never
server.error.include-message=never